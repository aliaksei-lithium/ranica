# Deploys the Worker to Cloudflare (docs/02-plan.md §5, CI/CD).
#   push to main        → tests, then `wrangler deploy` (production, workers.dev)
#   pull request        → `wrangler versions upload` with a preview alias pr-<number>
#   manual run          → deploy the selected branch
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README › Deploy).
# Without them the jobs skip the upload with a notice instead of failing.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: wrangler deploy
        id: deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy."
            exit 0
          fi
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url/today" >> "$GITHUB_STEP_SUMMARY"

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: wrangler versions upload (preview)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets for this run (not set, or a PR from a fork); skipping preview."
            exit 0
          fi
          npx wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" \
            2>&1 | tee preview.log
          url=$(grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' preview.log | head -1)
          echo "Preview: ${url:-see log}/today" >> "$GITHUB_STEP_SUMMARY"
